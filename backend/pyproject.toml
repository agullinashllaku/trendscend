[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trendscend"
version = "0.1.0"
description = "Multi-agent crypto trading system backend"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.112.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "bandit[toml]>=1.7.10",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "S"]
ignore = [
    "S101",  # allow assert in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert — handled by ruff S101

[tool.hatch.build.targets.wheel]
packages = ["src/trendscend"]

[tool.pip-audit]
# Add CVE IDs here after review to suppress known false positives, e.g.:
# ignore-vulns = ["CVE-2023-12345"]
