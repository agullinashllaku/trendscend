name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Ruff check
        working-directory: backend
        run: uv run ruff check src tests
      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check src tests

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: mypy
        working-directory: backend
        run: uv run mypy src

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    # NOTE: Dependabot does not update workflow service images. Bump these digests
    # together with infra/docker-compose.yml (test_ci_service_digests_match_compose_digests).
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16@sha256:6f139d56042989bd35f50ba5986e492cd32e35cc6778c50be2659add298dc09f
        env:
          POSTGRES_USER: trendscend
          # CI-only throwaway credential for an ephemeral service container; not a secret.
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: trendscend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trendscend -d trendscend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Run tests with coverage
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://trendscend:ci_only_not_a_secret@localhost:5432/trendscend_test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: uv run pytest --cov-fail-under=80
      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        if: always()
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false

  security:
    name: Security scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # full history for gitleaks
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          enable-cache: true
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked --extra dev
      - name: Bandit (Python SAST)
        working-directory: backend
        run: uv run bandit -r src -ll -x tests
      - name: pip-audit (dependency vulnerabilities)
        working-directory: backend
        run: uv run pip-audit
      - name: gitleaks (secret scanning)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: "HIGH,CRITICAL"
          scanners: "vuln"
          skip-dirs: ".venv,backend/.venv,node_modules,.git"
          trivyignores: ".trivyignore"

  docker-health:
    name: Docker stack health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start stack
        working-directory: infra
        run: docker compose up -d
      - name: Wait for Postgres to be healthy
        working-directory: infra
        run: |
          timeout 60 bash -c \
            'until docker compose exec -T postgres \
              pg_isready -U trendscend -d trendscend; \
            do sleep 2; done'
      - name: Wait for Redis to be healthy
        working-directory: infra
        run: |
          timeout 30 bash -c \
            'until docker compose exec -T redis \
              redis-cli ping | grep -q PONG; \
            do sleep 2; done'
      - name: Verify TimescaleDB extension loaded
        working-directory: infra
        run: |
          timeout 30 bash -c \
            'until docker compose exec -T postgres \
              psql -U trendscend -d trendscend \
              -c "SELECT extname FROM pg_extension WHERE extname = '"'"'timescaledb'"'"';" \
              | grep -q timescaledb; \
            do sleep 2; done'
      - name: Tear down
        if: always()
        working-directory: infra
        run: docker compose down -v
